name: Deploy verified static content to Pages

on:
  workflow_run:
    workflows: ["Builder CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: Set up Node for manual verification
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies for manual verification
        if: github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: Verify manually dispatched revision
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm run check
          git diff --exit-code -- assets

      - name: Prepare production artifact
        run: |
          rm -rf _site
          mkdir -p _site/design-v1
          cp index.html styles.css layout-overrides.css favicon.svg logo.svg _site/
          cp -R assets _site/assets
          cp -R vendor _site/vendor
          cp design-v1/index.html design-v1/site.js design-v1/styles.css _site/design-v1/
          cp -R design-v1/klangbehandlungen _site/design-v1/klangbehandlungen
          touch _site/.nojekyll

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
