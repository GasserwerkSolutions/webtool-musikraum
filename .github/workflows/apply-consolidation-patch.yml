name: Apply final consolidation patch

on:
  push:
    branches: [chore/consolidate-main-2026-08-20]
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/consolidate-main-2026-08-20
      - name: Verify and apply patch
        run: |
          sha256sum .github/consolidation-patch.b64.part-*
          cat .github/consolidation-patch.b64.part-* > /tmp/consolidation.patch.b64
          sha256sum /tmp/consolidation.patch.b64
          base64 --decode /tmp/consolidation.patch.b64 > /tmp/consolidation.patch
          sha256sum /tmp/consolidation.patch
          git apply --check --binary /tmp/consolidation.patch
          git apply --binary /tmp/consolidation.patch
          rm .github/consolidation-patch.b64.part-* .github/workflows/apply-consolidation-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore a clean verified project state"
          git push origin HEAD:chore/consolidate-main-2026-08-20
