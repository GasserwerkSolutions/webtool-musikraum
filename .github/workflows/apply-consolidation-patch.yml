name: Apply final consolidation patch

on:
  push:
    branches: [chore/consolidate-main-2026-08-20]
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/consolidate-main-2026-08-20
      - name: Verify and apply product patch
        run: |
          sha256sum .github/consolidation-patch.b64.part-*
          cat .github/consolidation-patch.b64.part-* > /tmp/consolidation.patch.b64
          test "$(sha256sum /tmp/consolidation.patch.b64 | cut -d' ' -f1)" = "01950462f4519be6916c696d9b23427cc5bf731c4cd577524493f763b54ca5e6"
          base64 --decode /tmp/consolidation.patch.b64 > /tmp/consolidation.patch
          test "$(sha256sum /tmp/consolidation.patch | cut -d' ' -f1)" = "c72147b2a53cb375426708684f976336c4d2887bb1174d07f91891f5f2fc805b"
          git apply --check --binary /tmp/consolidation.patch
          git apply --binary /tmp/consolidation.patch
          git restore --source=HEAD -- .github/workflows/ci.yml .github/workflows/static.yml
          rm .github/consolidation-patch.b64.part-*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore a clean verified project state"
          git push origin HEAD:chore/consolidate-main-2026-08-20
