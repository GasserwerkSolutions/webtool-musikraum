name: Source Snapshot

on:
  push:
    branches:
      - feature/raum-fuer-klang-svg-platzhalter

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/upload-artifact@v4
        with:
          name: webtool-source-with-dependencies
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
